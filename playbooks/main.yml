---
- name: Deploy NUT server.
  hosts: nut
  become: true

  handlers:
    - import_tasks: ../handlers/main.yml

  vars_files:
    - ../vars/main.yml
    - ../vars/secrets.yml

  tasks:

    - name: Install NUT.
      apt:
        name:
          - nut
        state: present

    - name: "Template config files to remote server."
      template:
        src: "../templates/{{ item }}.j2"
        dest: "/etc/nut/{{ item }}"
        owner: root
        group: nut
        mode: 0640
      loop:
        - nut.conf
        - ups.conf
        - upsd.conf
        - upsd.users
        - upsmon.conf
      notify: Restart services

    - name: Enable services now and at boot.
      service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - nut-server
        - nut-monitor
